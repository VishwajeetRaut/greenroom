name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest tests/ -v --tb=short
        env:
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          GROQ_API_KEY: "test-key"

      # Informational only (never fails the build) — a known CVE in a
      # transitive dependency shouldn't silently block every PR with no
      # warning. Check the job's own output for findings until this has
      # been triaged; only then consider making it a real gate.
      - name: Dependency vulnerability scan (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt --desc || true

  frontend-lint-test:
    name: Frontend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (vitest)
        run: npm run test -- --run

      # Informational only, same reasoning as the backend's pip-audit step.
      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high || true
