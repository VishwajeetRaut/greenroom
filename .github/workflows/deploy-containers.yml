name: Build, Push & Deploy

# Gated on the CI workflow (ci.yml) succeeding on main, via workflow_run —
# not an independent push trigger. Before this, deploy ran in parallel with
# CI on every push to main: a commit that failed lint/tests could still
# build and go live in production at the same time CI was reporting it
# broken, since the two workflows had no relationship to each other.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GITHUB_USER: vishwajeetraut
  RESOURCE_GROUP: greenroom-rg
  API_APP: greenroom-api
  FRONTEND_APP: greenroom-frontend
  FRONTEND_ORIGIN: https://greenroom-frontend.graybay-9c347e62.swedencentral.azurecontainerapps.io
  API_ORIGIN: https://greenroom-api.graybay-9c347e62.swedencentral.azurecontainerapps.io

# A second push landing mid-deploy queues behind the first instead of
# racing it — two overlapping `az containerapp update` calls against the
# same app is the kind of thing that produces a genuinely confusing
# incident, not just a wasted build.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # workflow_run fires for every completed run of "CI" — including PR runs
    # and failed runs. Only proceed for a successful run that was itself
    # triggered by a push to main; a PR's CI run (event: pull_request) must
    # never deploy, and a failed CI run must never deploy.
    #
    # Also gated to the canonical repo: forks (e.g. a contributor's own
    # Geet42/greenroom) run this same workflow file on their own pushes to
    # their own main, but their GITHUB_TOKEN has no access to
    # vishwajeetraut's GHCR namespace or Azure resources — every push/deploy
    # step would fail with permission_denied. Skip it there instead of
    # burning a red X on every fork push for a deploy that was never going
    # to succeed.
    if: >
      github.repository == 'VishwajeetRaut/greenroom' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    permissions:
      contents: read
      packages: write
      security-events: write
    environment:
      name: production
      url: ${{ env.FRONTEND_ORIGIN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, not the
          # commit that actually triggered the upstream CI run — pin to it
          # explicitly so a deploy always ships the commit CI just validated.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # ── Build & push both images ─────────────────────────────────────────

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.GITHUB_USER }}/greenroom-api:${{ steps.sha.outputs.short }}
            ghcr.io/${{ env.GITHUB_USER }}/greenroom-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.GITHUB_USER }}/greenroom-frontend:${{ steps.sha.outputs.short }}
            ghcr.io/${{ env.GITHUB_USER }}/greenroom-frontend:latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_API_URL=${{ env.API_ORIGIN }}/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Vulnerability scan ────────────────────────────────────────────────
      # Informational, not a gate: fails-open (exit-code 0) so a CVE in a base
      # image doesn't suddenly brick every deploy with no warning. Results go
      # to the repo's Security > Code scanning tab either way. Once that tab
      # has been reviewed and the noise is manageable, flip exit-code to '1'
      # (or add severity: 'CRITICAL' only) to make this an actual gate.
      - name: Scan backend image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.GITHUB_USER }}/greenroom-api:${{ steps.sha.outputs.short }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      # Genuinely non-blocking, matching the scan above: a future GitHub API
      # hiccup or permissions regression here must never stop the actual
      # deploy below it in the same job.
      - name: Upload backend scan results
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      # ── Deploy to Azure Container Apps ───────────────────────────────────

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Recorded before the update so a failed health check below can put the
      # backend back exactly where it was, automatically, instead of leaving
      # a known-broken revision serving live candidates until someone notices
      # and rolls back by hand.
      - name: Record current backend image (for rollback)
        id: previous
        run: |
          prev=$(az containerapp show \
            --name ${{ env.API_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].image" -o tsv)
          echo "image=$prev" >> "$GITHUB_OUTPUT"
          echo "Current backend image before this deploy: $prev"

      - name: Deploy backend
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name ${{ env.API_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ghcr.io/${{ env.GITHUB_USER }}/greenroom-api:${{ steps.sha.outputs.short }} \
              --set-env-vars \
                GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
                GROQ_MODEL="${{ secrets.GROQ_MODEL }}" \
                SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
                SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                FALLBACK_BASE_URL="${{ secrets.FALLBACK_BASE_URL }}" \
                FALLBACK_API_KEY="${{ secrets.FALLBACK_API_KEY }}" \
                FALLBACK_MODEL="${{ secrets.FALLBACK_MODEL }}" \
                AZURE_OPENAI_API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}" \
                AZURE_OPENAI_ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
                AZURE_OPENAI_DEPLOYMENT="${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" \
                AZURE_OPENAI_API_VERSION="${{ secrets.AZURE_OPENAI_API_VERSION }}" \
                ALLOWED_ORIGINS="${{ env.FRONTEND_ORIGIN }}" \
              --output none

      - name: Deploy frontend
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name ${{ env.FRONTEND_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ghcr.io/${{ env.GITHUB_USER }}/greenroom-frontend:${{ steps.sha.outputs.short }} \
              --output none

      # ── Verify the deploy actually landed ────────────────────────────────
      # A successful `az containerapp update` only means Azure accepted the
      # new image — it says nothing about whether the container actually
      # started and passed its own startup checks. Poll the live health
      # endpoint so a broken deploy fails loudly here instead of being
      # discovered by the first candidate who tries to use the app.
      - name: Verify backend health after deploy
        id: healthcheck
        run: |
          echo "Waiting for the new revision to come up..."
          for i in $(seq 1 10); do
            status=$(curl -s -o /tmp/health.json -w "%{http_code}" "${{ env.API_ORIGIN }}/api/health" || echo "000")
            if [ "$status" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              echo "Backend healthy after deploy:"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $i: HTTP $status, retrying in 10s..."
            sleep 10
          done
          echo "::error::Backend did not report healthy within 100s of deploying."
          [ -f /tmp/health.json ] && cat /tmp/health.json
          exit 1

      # Only runs when the health check above actually failed. Puts the
      # backend back on the image it was running before this deploy started
      # (captured in the "Record current backend image" step), so a bad
      # deploy self-heals within the same run instead of staying broken
      # until a human notices and rolls back manually.
      - name: Roll back backend on failed health check
        if: failure() && steps.healthcheck.outcome == 'failure' && steps.previous.outputs.image != ''
        run: |
          echo "::warning::Health check failed — rolling back backend to ${{ steps.previous.outputs.image }}"
          az containerapp update \
            --name ${{ env.API_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "${{ steps.previous.outputs.image }}" \
            --output none
          echo "Rolled back. The job still fails below — the bad image was pushed and tagged, it just isn't serving traffic anymore. Fix the underlying issue before re-running."

      - name: Summary
        if: always()
        run: |
          echo "### Deployed commit \`${{ steps.sha.outputs.short }}\` to Azure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ env.FRONTEND_ORIGIN }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ env.API_ORIGIN }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.healthcheck.outcome }}" = "failure" ]; then
            echo "- ⚠️ Health check failed — backend was automatically rolled back to \`${{ steps.previous.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          fi
